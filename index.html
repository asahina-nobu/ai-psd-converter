<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI / PSD コンバーター</title>
<style>
  :root {
    --bg: #f6f6f4; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --border: #d8d8d2; --accent: #2b59c3; --accent-text: #ffffff;
    --ok: #1d7a3f; --ng: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --surface: #20201f; --text: #ecece8; --muted: #9a9a94;
      --border: #3a3a37; --accent: #6b92ee; --accent-text: #0e1220;
      --ok: #5fcf8a; --ng: #f2877f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif; line-height: 1.6; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .options { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; font-size: 14px; flex-wrap: wrap; }
  .options label { cursor: pointer; }
  #drop { border: 2px dashed var(--border); border-radius: 12px; background: var(--surface);
    padding: 48px 16px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
  #drop.over { border-color: var(--accent); }
  #drop strong { display: block; font-size: 17px; margin-bottom: 4px; }
  #drop span { color: var(--muted); font-size: 13px; }
  #list { list-style: none; padding: 0; margin: 24px 0 0; display: grid; gap: 8px; }
  .item { display: flex; align-items: center; gap: 12px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
  .item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  .item .msg { font-size: 12px; color: var(--muted); }
  .item .status { font-size: 13px; font-weight: 600; }
  .ok { color: var(--ok); } .ng { color: var(--ng); }
  .item a, .item button.dl { background: var(--accent); color: var(--accent-text); text-decoration: none;
    border: 0; border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .note { margin-top: 32px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>AI / PSD コンバーター</h1>
  <p class="sub">ファイルはこのブラウザの中だけで処理され、外部には送信されません。</p>

  <div class="options">
    <span>PSDの変換先:</span>
    <label><input type="radio" name="psdfmt" value="png" checked> PNG</label>
    <label><input type="radio" name="psdfmt" value="pdf"> PDF</label>
  </div>

  <div id="drop" tabindex="0">
    <strong>ここに .ai / .psd ファイルをドロップ</strong>
    <span>クリックして選択もできます(複数可) / .ai → PDF、.psd → PNG または PDF</span>
  </div>
  <input id="file" type="file" accept=".ai,.psd" multiple hidden>

  <ul id="list"></ul>

  <p class="note">
    .ai は「PDF互換ファイルを作成」を有効にして保存されたもののみ変換できます(Illustratorの既定設定)。
    .psd は「互換性を優先」を有効にして保存されたもののみ変換できます(RGB / CMYK / グレースケールに対応)。
  </p>
</main>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
const drop = document.getElementById('drop');
const input = document.getElementById('file');
const list = document.getElementById('list');

drop.addEventListener('click', () => input.click());
drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') input.click(); });
input.addEventListener('change', () => { handleFiles(input.files); input.value = ''; });
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => handleFiles(e.dataTransfer.files));
// ページのどこにドロップしてもブラウザがファイルを開かないようにする
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

function psdFormat() {
  return document.querySelector('input[name="psdfmt"]:checked').value;
}

function addItem(name) {
  const li = document.createElement('li');
  li.className = 'item';
  li.innerHTML = '<div class="name"></div><div class="status">変換中…</div>';
  li.querySelector('.name').textContent = name;
  list.prepend(li);
  return li;
}

function finish(li, ok, msg, blob, outName) {
  const status = li.querySelector('.status');
  status.className = 'status ' + (ok ? 'ok' : 'ng');
  status.textContent = ok ? '完了' : '失敗';
  const name = li.querySelector('.name');
  const m = document.createElement('div');
  m.className = 'msg';
  m.textContent = msg;
  name.appendChild(m);
  if (ok && blob) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = outName;
    a.textContent = 'ダウンロード';
    li.appendChild(a);
    a.click(); // 自動でも保存を開始
  }
}

async function handleFiles(files) {
  for (const file of files) {
    const li = addItem(file.name);
    const ext = file.name.split('.').pop().toLowerCase();
    const base = file.name.replace(/\.[^.]+$/, '');
    try {
      if (ext === 'ai') {
        await convertAi(file, base, li);
      } else if (ext === 'psd') {
        await convertPsd(file, base, li);
      } else {
        finish(li, false, '.ai か .psd のファイルを指定してください。');
      }
    } catch (err) {
      console.error(err);
      finish(li, false, '予期しないエラー: ' + (err && err.message ? err.message : err));
    }
  }
}

// .ai → .pdf : PDF互換データを含むファイルは、そのままPDFとして取り出せる
async function convertAi(file, base, li) {
  const head = new Uint8Array(await file.slice(0, 1024).arrayBuffer());
  const text = new TextDecoder('latin1').decode(head);
  if (text.includes('%PDF-')) {
    const blob = new Blob([file], { type: 'application/pdf' });
    finish(li, true, 'PDF互換データを検出し、そのままPDFとして保存しました。', blob, base + '.pdf');
  } else {
    finish(li, false, 'PDF互換データがありません。Illustratorで「PDF互換ファイルを作成」を有効にして保存し直してください。');
  }
}

// PSDPARSER-BEGIN
// PSDの末尾にある「合成済み画像」だけを直接読む(レイヤーは解析しないので高速)。
// 対応: グレースケール / RGB / CMYK、8bit / 16bit、非圧縮 / RLE圧縮
function psdToRgba(buf) {
  const dv = new DataView(buf);
  const u8 = new Uint8Array(buf);
  if (buf.byteLength < 30 || dv.getUint32(0) !== 0x38425053) throw new Error('PSDファイルではありません。');
  if (dv.getUint16(4) !== 1) throw new Error('PSB(大判形式)には未対応です。');
  const channels = dv.getUint16(12);
  const height = dv.getUint32(14);
  const width = dv.getUint32(18);
  const depth = dv.getUint16(22);
  const mode = dv.getUint16(24);

  const need = { 1: 1, 3: 3, 4: 4 }[mode];
  if (!need) throw new Error('未対応のカラーモードです(モード番号 ' + mode + ')。Photoshopで RGB に変換して保存し直してください。');
  if (depth !== 8 && depth !== 16) throw new Error(depth + 'bit には未対応です。8bit または 16bit で保存し直してください。');
  if (channels < need) throw new Error('チャンネル数が不足しています。');
  const bps = depth / 8;

  let pos = 26;
  for (let i = 0; i < 3; i++) {            // カラーモード情報 / 画像リソース / レイヤー情報 を読み飛ばす
    if (pos + 4 > buf.byteLength) throw new Error('ファイルが壊れているか、途中で切れています。');
    pos += 4 + dv.getUint32(pos);
  }
  if (pos + 2 > buf.byteLength) throw new Error('合成画像のデータが見つかりません。');
  const comp = dv.getUint16(pos); pos += 2;

  const planeSize = width * height;
  const planes = [];
  for (let c = 0; c < need; c++) planes.push(new Uint8Array(planeSize));

  if (comp === 0) {                         // 非圧縮
    const chBytes = planeSize * bps;
    if (pos + chBytes * need > buf.byteLength) throw new Error('画像データが途中で切れています。');
    for (let c = 0; c < need; c++) {
      const base = pos + c * chBytes;
      const plane = planes[c];
      if (bps === 1) plane.set(u8.subarray(base, base + planeSize));
      else for (let i = 0; i < planeSize; i++) plane[i] = u8[base + i * 2];   // 16bit は上位バイトを使う
    }
  } else if (comp === 1) {                  // RLE(PackBits)
    let tab = pos;
    pos += channels * height * 2;           // 行ごとのバイト数テーブルは全チャンネル分ある
    const rowBytes = width * bps;
    const row = new Uint8Array(rowBytes);
    for (let c = 0; c < need; c++) {
      const plane = planes[c];
      for (let y = 0; y < height; y++) {
        const rowLen = dv.getUint16(tab); tab += 2;
        const end = pos + rowLen;
        if (end > buf.byteLength) throw new Error('画像データが途中で切れています。');
        let i = pos, o = 0;
        while (o < rowBytes && i < end) {
          const n = u8[i++];
          if (n < 128) {
            const len = Math.min(n + 1, rowBytes - o);
            row.set(u8.subarray(i, i + len), o);
            i += n + 1; o += len;
          } else if (n > 128) {
            const len = Math.min(257 - n, rowBytes - o);
            row.fill(u8[i++], o, o + len);
            o += len;
          }
        }
        pos = end;
        const off = y * width;
        if (bps === 1) plane.set(row, off);
        else for (let x = 0; x < width; x++) plane[off + x] = row[x * 2];
      }
    }
  } else {
    throw new Error('未対応の圧縮形式です(' + comp + ')。');
  }

  const rgba = new Uint8ClampedArray(planeSize * 4);
  if (mode === 1) {
    const g = planes[0];
    for (let i = 0, j = 0; i < planeSize; i++, j += 4) { rgba[j] = rgba[j + 1] = rgba[j + 2] = g[i]; rgba[j + 3] = 255; }
  } else if (mode === 3) {
    const [r, g, b] = planes;
    for (let i = 0, j = 0; i < planeSize; i++, j += 4) { rgba[j] = r[i]; rgba[j + 1] = g[i]; rgba[j + 2] = b[i]; rgba[j + 3] = 255; }
  } else {                                  // CMYK: Photoshopは値を反転して保存(255 = インクなし)
    const [c, m, y, k] = planes;
    for (let i = 0, j = 0; i < planeSize; i++, j += 4) {
      const kk = k[i];
      rgba[j] = (c[i] * kk) / 255;
      rgba[j + 1] = (m[i] * kk) / 255;
      rgba[j + 2] = (y[i] * kk) / 255;
      rgba[j + 3] = 255;
    }
  }
  return { width, height, rgba, mode };
}
// PSDPARSER-END

// .psd → .png / .pdf : 合成済み画像を取り出して変換する
async function convertPsd(file, base, li) {
  const buf = await file.arrayBuffer();
  let img;
  try {
    img = psdToRgba(buf);
  } catch (err) {
    finish(li, false, err.message);
    return;
  }
  const canvas = document.createElement('canvas');
  canvas.width = img.width;
  canvas.height = img.height;
  const ctx = canvas.getContext('2d');
  if (!ctx) {
    finish(li, false, '画像サイズが大きすぎて処理できませんでした。');
    return;
  }
  ctx.putImageData(new ImageData(img.rgba, img.width, img.height), 0, 0);
  const pngBlob = await new Promise(res => canvas.toBlob(res, 'image/png'));
  if (!pngBlob) {
    finish(li, false, '画像サイズが大きすぎてPNGに変換できませんでした。');
    return;
  }
  const cmykNote = img.mode === 4 ? '(CMYK→RGBは簡易変換のため、色味が少し異なる場合があります)' : '';
  if (psdFormat() === 'png') {
    finish(li, true, img.width + ' × ' + img.height + ' px のPNGに変換しました。' + cmykNote, pngBlob, base + '.png');
    return;
  }
  const { PDFDocument } = PDFLib;
  const pdf = await PDFDocument.create();
  const png = await pdf.embedPng(await pngBlob.arrayBuffer());
  const page = pdf.addPage([png.width, png.height]);
  page.drawImage(png, { x: 0, y: 0, width: png.width, height: png.height });
  const bytes = await pdf.save();
  finish(li, true, img.width + ' × ' + img.height + ' px のPDFに変換しました。' + cmykNote, new Blob([bytes], { type: 'application/pdf' }), base + '.pdf');
}
</script>
</body>
</html>
